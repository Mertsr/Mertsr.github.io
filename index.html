<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gökyüzü Parkuru</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; background:#05070d; }
  #hud {
    position:fixed; top:16px; left:16px; color:#e8eef7; z-index:10;
    background:rgba(8,12,22,.6); backdrop-filter:blur(8px);
    border:1px solid rgba(150,180,255,.25); border-radius:12px;
    padding:14px 18px; min-width:170px; user-select:none;
  }
  #hud .speed { font-size:34px; font-weight:700; letter-spacing:1px; }
  #hud .speed span { font-size:14px; font-weight:400; opacity:.7; }
  #hud .row { font-size:13px; margin-top:6px; opacity:.9; display:flex; justify-content:space-between; gap:16px; }
  #hud .row b { font-variant-numeric:tabular-nums; }
  #controls {
    position:fixed; bottom:16px; left:16px; color:#aebdd2; z-index:10;
    background:rgba(8,12,22,.55); backdrop-filter:blur(8px);
    border:1px solid rgba(150,180,255,.18); border-radius:10px;
    padding:10px 14px; font-size:12px; line-height:1.7; user-select:none;
  }
  #controls kbd {
    background:#1c2635; border:1px solid #33455e; border-radius:4px;
    padding:1px 6px; font-size:11px; color:#dfe9f5;
  }
  #msg {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    color:#ffd66b; font-size:22px; font-weight:700; z-index:10;
    text-shadow:0 2px 8px rgba(0,0,0,.8); opacity:0; transition:opacity .4s;
    pointer-events:none; text-align:center;
  }
  #msg.show { opacity:1; }
  #touch { position:fixed; inset:0; z-index:9; display:none; pointer-events:none; }
  .tbtn {
    position:absolute; width:64px; height:64px; border-radius:50%;
    background:rgba(150,180,255,.12); border:2px solid rgba(150,180,255,.4);
    color:#e8eef7; font-size:22px; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .tbtn:active { background:rgba(150,180,255,.35); }
  #tL{ left:20px; bottom:90px; } #tR{ left:110px; bottom:90px; }
  #tG{ right:20px; bottom:150px; } #tB{ right:20px; bottom:60px; }
  #tN{ right:110px; bottom:150px; font-size:12px; font-weight:700; }
  #tJ{ right:110px; bottom:60px; font-size:20px; }
  @media (pointer:coarse) { #touch{display:block;} #controls{display:none;} }

  /* Karakter seçim ekranı */
  #charSelect {
    position:fixed; inset:0; z-index:50;
    background:radial-gradient(circle at 30% 20%, #101a2e, #05070d 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; color:#e8eef7;
  }
  #charSelect h1 {
    font-size:clamp(26px,5vw,44px); font-weight:800; letter-spacing:1px;
    text-shadow:0 4px 24px rgba(120,160,255,.4);
  }
  #charSelect .cards { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
  #charSelect .card {
    width:180px; padding:22px 18px 18px; border-radius:18px; cursor:pointer;
    background:rgba(20,28,44,.75); border:2px solid rgba(150,180,255,.22);
    display:flex; flex-direction:column; align-items:center; gap:14px;
    transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  #charSelect .card:hover, #charSelect .card:focus-visible {
    transform:translateY(-6px); border-color:#7aa8ff;
    box-shadow:0 12px 40px rgba(90,140,255,.35); outline:none;
  }
  #charSelect .cname { font-size:16px; font-weight:600; }
  /* basit avatar önizleme (CSS bloklar) */
  .avatar { position:relative; width:70px; height:120px; }
  .avatar .hair, .avatar .face, .avatar .body { position:absolute; left:50%; transform:translateX(-50%); border-radius:6px; }
  .avatar .face { top:22px; width:34px; height:34px; background:#e8b48c; z-index:2; }
  .avatar .body { top:58px; width:46px; height:56px; z-index:1; }
  .boy .hair { top:10px; width:40px; height:20px; background:#3a2a1a; z-index:3; }
  .boy .body { background:#3a6ea5; }
  .girl .hair { top:12px; width:44px; height:70px; background:#6b3d1f; z-index:1; border-radius:8px 8px 12px 12px; }
  .girl .body { background:#ff5fa8; }
  #charSelect .hint { font-size:13px; opacity:.65; }
</style>
</head>
<body>
<div id="charSelect">
  <h1>Karakterini seç</h1>
  <div class="cards">
    <button class="card" data-char="boy">
      <div class="avatar boy"><span class="hair"></span><span class="face"></span><span class="body"></span></div>
      <div class="cname">Mavi Kazak</div>
    </button>
    <button class="card" data-char="girl">
      <div class="avatar girl"><span class="hair"></span><span class="face"></span><span class="body"></span></div>
      <div class="cname">Pembe Kazak</div>
    </button>
  </div>
  <p class="hint">Gökyüzü parkuru · Shift ile sprint · Boşluk ile zıpla · Boşluğa düşme!</p>
</div>
<div id="hud">
  <div class="speed"><span id="spd">0</span><span> km/s</span></div>
  <div class="row"><span>Süre</span><b id="air">0.0 sn</b></div>
  <div class="row"><span>Kontrol noktası</span><b id="jumps">1 / 5</b></div>
</div>
<div id="controls">
  <kbd>W</kbd>/<kbd>↑</kbd> koş &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> geri &nbsp; <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> dön<br>
  <kbd>Boşluk</kbd> zıpla &nbsp; <kbd>Shift</kbd> sprint (sınırsız) &nbsp; <kbd>R</kbd> sıfırla &nbsp; <kbd>C</kbd> kamera
</div>
<div id="msg"></div>
<div id="touch">
  <div class="tbtn" id="tL">◀</div><div class="tbtn" id="tR">▶</div>
  <div class="tbtn" id="tG">▲</div><div class="tbtn" id="tB">▼</div>
  <div class="tbtn" id="tN">DAŞ</div>
  <div class="tbtn" id="tJ">⤒</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Sahne (gökyüzü parkuru) ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f5);
scene.fog = new THREE.Fog(0xbfe0f5, 120, 620);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 3000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// güneş
const moonLight = new THREE.DirectionalLight(0xffffff, 1.05);
moonLight.position.set(-120, 180, -60);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -160; moonLight.shadow.camera.right = 160;
moonLight.shadow.camera.top = 160; moonLight.shadow.camera.bottom = -160;
moonLight.shadow.camera.far = 600;
scene.add(moonLight);
scene.add(new THREE.AmbientLight(0xcfe6ff, 0.75));
scene.add(new THREE.HemisphereLight(0xdcefff, 0x9fc4dc, 0.5));

// ---------- Ayna gibi deniz (ölüm zemini) ----------
const SEA_Y = -40;                       // deniz yüzeyi
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshPhongMaterial({ color:0x4a86b8, shininess:120, transparent:true, opacity:0.92 })
);
sea.rotation.x = -Math.PI/2;
sea.position.y = SEA_Y;
sea.receiveShadow = true;
scene.add(sea);

// bulutlar (yassı beyaz spriteler)
const cloudTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64,64,8,64,64,62);
  grad.addColorStop(0,'rgba(255,255,255,0.9)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
for (let i=0;i<40;i++){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:cloudTex, transparent:true, opacity:0.65, depthWrite:false }));
  const sc = 40 + Math.random()*90;
  s.scale.set(sc, sc*0.55, 1);
  s.position.set((Math.random()-0.5)*1400, -10 + Math.random()*90, (Math.random()-0.5)*1400);
  scene.add(s);
}

// ---------- Malzemeler ----------
function roughen(geo, amt) {
  const p = geo.attributes.position;
  for (let i=0;i<p.count;i++){
    if (p.getY(i) > 0.05) {
      p.setX(i, p.getX(i) + (Math.random()-0.5)*amt);
      p.setZ(i, p.getZ(i) + (Math.random()-0.5)*amt);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

// ---------- Yükseklik alanı sistemi (platform tabanlı) ----------
// Her platform bir yükseklik döndürür; hiçbir platform yoksa VOID (çok aşağı) döner.
const VOID = -9999;
const platforms = [];   // { test(x,z)->h veya null }
const clearZones = [];  // (dünyada dekor yok ama API uyumu için tutuluyor)
const treeColliders = []; // (bu dünyada boş — ağaç yok)
const checkpoints = [];   // { x, z, y, r, idx }

function groundHeight(x, z) {
  let h = VOID;
  for (const p of platforms) {
    const v = p(x, z);
    if (v !== null && v > h) h = v;
  }
  return h;
}
// heightFields — eski API ile uyum (bazı yerlerde referans olabilir)
const heightFields = [];

// ---- dikdörtgen platform ----
const platMatA = new THREE.MeshLambertMaterial({ color:0x3fa66a });   // canlı yeşil
const platMatB = new THREE.MeshLambertMaterial({ color:0x2e7d54 });   // koyu yeşil
const edgeMat  = new THREE.MeshLambertMaterial({ color:0x1d3557 });   // koyu lacivert kenar
let platIndex = 0;
function addPlatform(x, y, z, w, d, opts) {
  opts = opts || {};
  const mat = (platIndex++ % 2 === 0) ? platMatA : platMatB;
  const top = new THREE.Mesh(new THREE.BoxGeometry(w, 1.2, d), mat);
  top.position.set(x, y - 0.6, z);
  top.castShadow = true; top.receiveShadow = true;
  scene.add(top);
  // lacivert kenar şeridi (collision alanından taşmaz)
  const edge = new THREE.Mesh(new THREE.BoxGeometry(w-0.15, 0.5, d-0.15), edgeMat);
  edge.position.set(x, y - 1.3, z);
  scene.add(edge);
  const hw = w/2, hd = d/2;
  platforms.push((px, pz) => {
    if (px > x-hw && px < x+hw && pz > z-hd && pz < z+hd) return y;
    return null;
  });
  return { x, y, z, w, d };
}

// ---- eğimli rampa platformu (görsel 2'deki eğik yol) ----
function addRampPlatform(x, y, z, angleDeg, len, rise, w) {
  const ang = angleDeg * Math.PI/180;
  const dir = new THREE.Vector3(Math.sin(ang), 0, Math.cos(ang));
  const slope = Math.atan2(rise, len);
  // kutunun ÜST yüzü yürüme yüzeyi olsun: merkez, yüzeyin 0.4 altında
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, len/Math.cos(slope)),
    (platIndex++ % 2 === 0) ? platMatA : platMatB);
  mesh.position.set(x, y + rise/2 - 0.4, z);
  mesh.rotation.order = 'YXZ';   // önce yaw, sonra kendi ekseninde eğim
  mesh.rotation.y = ang;
  mesh.rotation.x = -slope;
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  [-w/2, w/2].forEach(off => {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, len/Math.cos(slope)), edgeMat);
    strip.position.set(x, y + rise/2 - 0.35, z);
    strip.rotation.order = 'YXZ';
    strip.rotation.y = ang; strip.rotation.x = -slope;
    strip.translateX(off);
    scene.add(strip);
  });
  const hw = w/2;
  platforms.push((px, pz) => {
    const dx = px-x, dz = pz-z;
    const along = dx*dir.x + dz*dir.z;
    const side  = dx*(-dir.z) + dz*(dir.x);
    if (Math.abs(side) < hw && along > -len/2 && along < len/2)
      return y + ((along + len/2)/len) * rise;
    return null;
  });
  return { endX: x + dir.x*(len/2), endZ: z + dir.z*(len/2), endY: y + rise, dir };
}

// ---- hareketli platform (yatay gidip gelir) ----
const movers = [];
function addMovingPlatform(x, y, z, w, d, axis, amp, speed) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 1.2, d),
    new THREE.MeshLambertMaterial({ color:0xffd166 }));
  mesh.position.set(x, y-0.6, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  const state = { x, y, z, w, d, axis, amp, speed, base:{x,z}, mesh };
  movers.push(state);
  const hw = w/2, hd = d/2;
  platforms.push((px, pz) => {
    if (px > state.x-hw && px < state.x+hw && pz > state.z-hd && pz < state.z+hd) return state.y;
    return null;
  });
  return state;
}

// ---- kontrol noktası bayrağı ----
function addCheckpoint(x, y, z) {
  const idx = checkpoints.length;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,4,8),
    new THREE.MeshLambertMaterial({ color:0xdddddd }));
  pole.position.set(x, y+2, z); pole.castShadow = true;
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.0),
    new THREE.MeshLambertMaterial({ color:0x37e884, side:THREE.DoubleSide }));
  flag.position.set(x+0.8, y+3.3, z);
  const g = new THREE.Group(); g.add(pole, flag); scene.add(g);
  checkpoints.push({ x, y, z, r:3.2, idx, flag, reached:false });
}

// ================= AŞAMALI PARKUR =================
// Başlangıç adası
addPlatform(0, 0, 0, 12, 12);
addCheckpoint(0, 0, 4);

// --- AŞAMA 1: düz zıplama taşları (görsel 1 gibi) ---
let px = 0, pz = 8, py = 0;
for (let i=0;i<6;i++){
  pz += 6 + i*0.4;
  addPlatform(px, py, pz, 4, 4);
}
pz += 7;
addPlatform(px, py, pz, 10, 10);
addCheckpoint(px, py, pz);
const s1 = { x:px, z:pz, y:py };

// --- AŞAMA 2: yükselen merdiven + hareketli platformlar ---
py = s1.y; pz = s1.z;
for (let i=0;i<5;i++){
  pz += 6; py += 0.9;   // zıplanabilir basamak yüksekliği
  addPlatform(px, py, pz, 4.5, 4.5);
}
// iki hareketli platform (yana kayan)
pz += 8;
addMovingPlatform(px, py, pz, 4, 4, 'x', 7, 0.7);
pz += 8;
addMovingPlatform(px, py, pz, 4, 4, 'x', 7, -0.9);
pz += 8;
const s2 = addPlatform(px, py, pz, 10, 10);
addCheckpoint(px, py, pz);

// --- AŞAMA 3: dönen köşe + eğik rampa (görsel 2 gibi) ---
// sağa 90° kıvrılan platformlar
let cx = px + 8, cz = pz, cy = py;
addPlatform(cx, cy, cz, 6, 6);
for (let i=0;i<4;i++){
  cx += 7;
  addPlatform(cx, cy, cz, 4.5, 4.5);
}
// aşağı inen büyük eğik rampa
cx += 6;
const ramp = addRampPlatform(cx, cy, cz, 90, 26, -8, 7);
// rampanın altında geniş iniş adası
const landX = ramp.endX, landZ = ramp.endZ, landY = ramp.endY;
addPlatform(landX + 4, landY, landZ, 12, 12);
addCheckpoint(landX + 4, landY, landZ);

// --- AŞAMA 4: dar köprü + boşluk atlamaları (görsel 2 uçurum hissi) ---
let bx = landX + 4, bz = landZ, by = landY;
// dar uzun köprü
for (let i=0;i<5;i++){
  bz -= 6;
  addPlatform(bx, by, bz, 2.4, 5);   // dar
}
// boşluk atlamaları — birbirinden uzak küçük adalar
bz -= 10; addPlatform(bx, by, bz, 3.5, 3.5);
bz -= 11; addPlatform(bx+3, by+0.8, bz, 3.5, 3.5);
bz -= 11; addPlatform(bx-3, by+1.4, bz, 3.5, 3.5);
bz -= 12;
// FİNAL kule adası
const finalP = addPlatform(bx, by+2.2, bz, 14, 14);
addCheckpoint(bx, by+2.2, bz);
// finalde altın kupa
const CUPY = by + 2.2;
const cup = new THREE.Group();
const cupBowl = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.5, 1.4, 16),
  new THREE.MeshPhongMaterial({ color:0xffd700, shininess:140, emissive:0x332200 }));
cupBowl.position.y = CUPY+1.6;
const cupStem = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.9,10),
  new THREE.MeshPhongMaterial({ color:0xffd700, shininess:140 }));
cupStem.position.y = CUPY+0.6;
const cupBase = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.25,14),
  new THREE.MeshPhongMaterial({ color:0xffd700, shininess:140 }));
cupBase.position.y = CUPY+0.2;
cup.add(cupBowl, cupStem, cupBase);
cup.position.set(bx, 0, bz);
scene.add(cup);
window._cup = { x:bx, y:CUPY, z:bz };

// spawn yüksekliği (karakterler başlangıç adasında dursun)
window._spawn = { x:0, y:0, z:0 };

// fireflies boş bırakılır (bu dünyada yok) ama döngü referansı için var
const fireflies = [];
// koniler bu dünyada yok — döngü referansı için boş dizi
const cones = [];


// ---------- İNSAN FİGÜRÜ (ön = +Z) — seçilebilir iki karakter ----------
const player = new THREE.Group();
const skinMat  = new THREE.MeshLambertMaterial({ color:0xe8b48c });
const shoeMat  = new THREE.MeshLambertMaterial({ color:0xe8e8e8 });

// hareketli uzuv (üst mat + alt mat2)
function limb(w, h, d, mat, mat2, splitY) {
  const g = new THREE.Group();
  const upper = new THREE.Mesh(new THREE.BoxGeometry(w, h*splitY, d), mat);
  upper.position.y = -h*splitY/2;
  const lower = new THREE.Mesh(new THREE.BoxGeometry(w*0.9, h*(1-splitY), d*0.9), mat2);
  lower.position.y = -h*splitY - h*(1-splitY)/2;
  upper.castShadow = lower.castShadow = true;
  g.add(upper, lower);
  return g;
}

// iki karakter tanımı
const CHARACTERS = {
  boy: {
    shirt: 0x3a6ea5,   // mavi tişört
    pants: 0x2a3550,
    hair:  0x3a2a1a,
    longHair: false
  },
  girl: {
    shirt: 0xff5fa8,   // pembe kazak
    pants: 0x6a3a86,   // mor tayt
    hair:  0x6b3d1f,   // kahverengi uzun saç
    longHair: true
  }
};

let armL, armR, legL, legR;   // animasyon için global
function buildCharacter(key) {
  // önceki figürü temizle
  while (player.children.length) player.remove(player.children[0]);
  const cfg = CHARACTERS[key];
  const shirtMat = new THREE.MeshLambertMaterial({ color:cfg.shirt });
  const pantsMat = new THREE.MeshLambertMaterial({ color:cfg.pants });
  const hairMat  = new THREE.MeshLambertMaterial({ color:cfg.hair });

  // gövde
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.34), shirtMat);
  torso.position.y = 1.12; torso.castShadow = true;
  player.add(torso);

  // kafa
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.42, 0.38), skinMat);
  head.position.y = 1.72; head.castShadow = true;
  player.add(head);

  // saç
  const hairTop = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.16, 0.42), hairMat);
  hairTop.position.y = 1.92; hairTop.castShadow = true;
  player.add(hairTop);
  if (cfg.longHair) {
    // uzun saç: sırta inen uzun blok + yanlar
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.95, 0.14), hairMat);
    back.position.set(0, 1.42, -0.2); back.castShadow = true;
    const sideL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.55, 0.42), hairMat);
    sideL.position.set(-0.25, 1.62, 0);
    const sideR = sideL.clone(); sideR.position.x = 0.25;
    // saç bandı / fiyonk
    const bow = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.1),
      new THREE.MeshLambertMaterial({ color:0xffffff }));
    bow.position.set(0.22, 1.98, 0.05);
    player.add(back, sideL, sideR, bow);
  } else {
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.3, 0.1), hairMat);
    back.position.set(0, 1.78, -0.17);
    player.add(back);
  }

  // kollar
  armL = limb(0.18, 0.66, 0.18, shirtMat, skinMat, 0.4);
  armL.position.set(-0.41, 1.44, 0);
  armR = limb(0.18, 0.66, 0.18, shirtMat, skinMat, 0.4);
  armR.position.set(0.41, 1.44, 0);
  player.add(armL, armR);

  // bacaklar
  legL = limb(0.22, 0.78, 0.24, pantsMat, pantsMat, 0.6);
  legL.position.set(-0.16, 0.78, 0);
  legR = limb(0.22, 0.78, 0.24, pantsMat, pantsMat, 0.6);
  legR.position.set(0.16, 0.78, 0);
  const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.34), shoeMat);
  shoeL.position.set(0, -0.78, 0.05); legL.add(shoeL);
  const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.34), shoeMat);
  shoeR.position.set(0, -0.78, 0.05); legR.add(shoeR);
  player.add(legL, legR);

  // el feneri (sağ elde)
  const torch = new THREE.SpotLight(0xfff1c4, 3.0, 45, Math.PI/5.5, 0.5, 1.1);
  torch.position.set(0.35, 1.1, 0.2);
  const torchTgt = new THREE.Object3D();
  torchTgt.position.set(0.1, 0.4, 20);
  player.add(torchTgt);
  torch.target = torchTgt;
  player.add(torch);
  const torchBody = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.22, 8),
    new THREE.MeshLambertMaterial({ color:0x333a44 }));
  torchBody.rotation.x = Math.PI/2;
  torchBody.position.set(0.35, 1.08, 0.18);
  player.add(torchBody);

  window._torch = torch;  // parlaklık ayarı için
}
buildCharacter('boy');   // varsayılan (seçimle değişecek)
scene.add(player);


// ---------- Oyuncu durumu ----------
const state = {
  pos: new THREE.Vector3(0, 0, 0),
  heading: 0,
  speed: 0, vy: 0, airborne: false, turn: 0,
  airStart: 0, runPhase: 0
};
const stats = { bestAir: 0, jumps: 0 };
// parkur ilerleme durumu
const prog = { activeCP: 0, startTime: 0, started: false, finished: false };
function respawnAt(cp) {
  // en son ulaşılan kontrol noktasında yeniden doğ
  state.pos.set(cp.x, cp.y, cp.z);
  state.heading = 0; state.speed = 0; state.vy = 0; state.airborne = false;
}
function resetPlayer() {
  const sp = window._spawn || { x:0, y:0, z:0 };
  state.pos.set(sp.x, sp.y, sp.z);
  state.heading = 0;
  state.speed = 0; state.vy = 0; state.airborne = false;
  prog.activeCP = 0; prog.started = false; prog.finished = false;
  checkpoints.forEach((c,i) => { c.reached = i===0; if (c.flag) c.flag.material.color.set(i===0 ? 0xffd166 : 0x37e884); });
  document.getElementById('jumps').textContent = '1 / ' + checkpoints.length;
}

// ---------- Girdi ----------
const keys = {};
let jumpQueued = false;
addEventListener('keydown', e => {
  if (e.code==='Space' && !keys['Space']) jumpQueued = true;
  keys[e.code]=true;
  if(e.code==='KeyR') resetPlayer();
  if(e.code==='KeyC') camMode=(camMode+1)%3;
  if(e.code==='Space' || e.code==='ShiftLeft' || e.code==='ShiftRight') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code]=false);
const bindT = (id, code, isJump) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); keys[code]=true; if(isJump) jumpQueued = true; }, {passive:false});
  el.addEventListener('touchend',   e=>{ e.preventDefault(); keys[code]=false; }, {passive:false});
};
bindT('tG','KeyW'); bindT('tB','KeyS'); bindT('tL','KeyA'); bindT('tR','KeyD');
bindT('tN','ShiftLeft'); bindT('tJ','Space', true);

// ---------- Mesaj ----------
const msgEl = document.getElementById('msg');
let msgTimer = null;
function showMsg(txt) {
  msgEl.textContent = txt; msgEl.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>msgEl.classList.remove('show'), 2200);
}

// ---------- Kamera ----------
let camMode = 0;
const camPos = new THREE.Vector3(0, 4, -7);

// ---------- Ana döngü ----------
const clock = new THREE.Clock();
const fwd = new THREE.Vector3();
let elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const active = window._started === true;
  const run   = active && (keys['KeyW']||keys['ArrowUp'])   ? 1 : 0;
  const back  = active && (keys['KeyS']||keys['ArrowDown']) ? 1 : 0;
  const left  = active && (keys['KeyA']||keys['ArrowLeft']) ? 1 : 0;
  const right = active && (keys['KeyD']||keys['ArrowRight'])? 1 : 0;
  const sprinting = (active && (keys['ShiftLeft']||keys['ShiftRight']) && run) ? true : false; // SINIRSIZ

  // ileri/geri hız
  const MAX_F = sprinting ? 38 : 20;
  const MAX_R = -8;
  const ACC = sprinting ? 68 : 44;
  if (run)  state.speed += ACC * dt;
  if (back) state.speed -= 16 * dt;
  state.speed -= state.speed * 4.5 * dt;
  state.speed = Math.max(MAX_R, Math.min(MAX_F, state.speed));
  if (!run && !back && Math.abs(state.speed) < 0.1) state.speed = 0;

  const turnTarget = (left - right);
  state.turn += (turnTarget - state.turn) * Math.min(1, dt*10);
  const turnRate = state.airborne ? 1.2 : 3.0;
  state.heading += state.turn * turnRate * dt;

  // ---- hareketli platformlar (fizikten ÖNCE: üstündekini birlikte taşır) ----
  for (const m of movers) {
    const off = Math.sin(elapsed * m.speed) * m.amp;
    const nx = (m.axis === 'x') ? m.base.x + off : m.x;
    const nz = (m.axis === 'z') ? m.base.z + off : m.z;
    const ddx = nx - m.x, ddz = nz - m.z;
    // platformun üstünde duran yaya/at platformla birlikte kayar
    const hw = m.w/2 + 0.3, hd = m.d/2 + 0.3;
    if (!state.airborne &&
        state.pos.x > m.x-hw && state.pos.x < m.x+hw &&
        state.pos.z > m.z-hd && state.pos.z < m.z+hd &&
        Math.abs(state.pos.y - m.y) < 0.6) {
      state.pos.x += ddx; state.pos.z += ddz;
    }
    m.x = nx; m.z = nz;
    m.mesh.position.set(m.x, m.y - 0.6, m.z);
  }

  // ============ YAYA ============
  {
    // konum (duvar kontrolü ile: yandan platforma girilmez)
    const STEP = 1.1;   // adımla çıkılabilir maks. yükseklik farkı
    fwd.set(Math.sin(state.heading), 0, Math.cos(state.heading));
    const oldX = state.pos.x, oldZ = state.pos.z;
    state.pos.x += fwd.x * state.speed * dt;
    state.pos.z += fwd.z * state.speed * dt;
    {
      const ghNew = groundHeight(state.pos.x, state.pos.z);
      if (ghNew > VOID + 1 && ghNew > state.pos.y + STEP) {
        // hedef zemin, karakterin çok üstünde → bu bir DUVAR: hareketi geri al
        state.pos.x = oldX; state.pos.z = oldZ;
        state.speed *= 0.2;
      }
    }

    // ağaç çarpışmaları
    for (const t of treeColliders) {
      const dx = state.pos.x - t.x, dz = state.pos.z - t.z;
      const d2 = dx*dx + dz*dz;
      const minR = t.r + 0.4;
      if (d2 < minR*minR && d2 > 0.001) {
        const d = Math.sqrt(d2);
        state.pos.x = t.x + dx/d*minR;
        state.pos.z = t.z + dz/d*minR;
        state.speed *= 0.5;
      }
    }

    // ZIPLAMA
    if (jumpQueued) {
      jumpQueued = false;
      if (active && !state.airborne) {
        state.airborne = true;
        state.airStart = elapsed;
        state.vy = 6.8 + Math.abs(state.speed)*0.1;
      }
    }

    // dikey (platform tabanlı — boşlukta serbest düşüş)
    const gh = groundHeight(state.pos.x, state.pos.z);
    const onPlatform = gh > VOID + 1;
    if (state.airborne || !onPlatform) {
      state.airborne = true;
      const prevY = state.pos.y;
      state.vy -= 20 * dt;
      state.pos.y += state.vy * dt;
      // iniş: yalnızca ÜSTTEN düşerken (önceki kare zeminin üstündeyse)
      if (onPlatform && state.vy <= 0 && state.pos.y <= gh && prevY >= gh - 0.05) {
        state.pos.y = gh; state.airborne = false; state.vy = 0;
      }
    } else {
      // yerde: sadece küçük yükseklik farklarını takip et (basamak); duvar zaten engellendi
      if (Math.abs(gh - state.pos.y) <= STEP + 0.2) {
        state.pos.y += (gh - state.pos.y) * Math.min(1, dt*14);
      } else if (gh < state.pos.y) {
        // altımızdaki zemin çok aşağıda → kenardan çıktık, düşmeye başla
        state.airborne = true;
        state.vy = 0;
      }
    }
    // boşluğa düştüyse kontrol noktasında yeniden doğ
    if (state.pos.y < SEA_Y + 3) {
      respawnAt(checkpoints[prog.activeCP]);
      showMsg('💦 Düştün! Kontrol noktasına dönüldü');
    }

    const B = 900;
    state.pos.x = Math.max(-B, Math.min(B, state.pos.x));
    state.pos.z = Math.max(-B, Math.min(B, state.pos.z));

    player.position.copy(state.pos);
    player.rotation.y = state.heading;
    player.rotation.x = state.airborne ? -0.1 : Math.min(0.18, Math.abs(state.speed)*0.014) * Math.sign(state.speed);

    // koşu animasyonu
    const moving = Math.abs(state.speed) > 0.3;
    if (state.airborne) {
      armL.rotation.x += (-2.4 - armL.rotation.x) * Math.min(1, dt*8);
      armR.rotation.x += (-2.4 - armR.rotation.x) * Math.min(1, dt*8);
      legL.rotation.x += (0.7 - legL.rotation.x) * Math.min(1, dt*8);
      legR.rotation.x += (-0.3 - legR.rotation.x) * Math.min(1, dt*8);
    } else if (moving) {
      state.runPhase += Math.abs(state.speed) * dt * 1.0;
      const sw = Math.min(1.0, Math.abs(state.speed)/16) * 0.95;
      const s = Math.sin(state.runPhase);
      legL.rotation.x = s * sw;
      legR.rotation.x = -s * sw;
      armL.rotation.x = -s * sw * 0.85;
      armR.rotation.x = s * sw * 0.85;
      player.position.y = state.pos.y + Math.abs(Math.cos(state.runPhase)) * 0.06;
    } else {
      [armL, armR, legL, legR].forEach(l => l.rotation.x += (0 - l.rotation.x) * Math.min(1, dt*6));
      state.runPhase = 0;
    }
  }

  if (window._torch) window._torch.intensity = sprinting ? 3.8 : 3.0;

  // koniler
  const kickSpeed = Math.abs(state.speed);
  const kickR = 1.0;
  for (const cn of cones) {
    if (!cn.hit) {
      const dx = cn.mesh.position.x - state.pos.x, dz = cn.mesh.position.z - state.pos.z;
      if (dx*dx + dz*dz < kickR && kickSpeed > 1.5 && state.pos.y < 1) {
        cn.hit = true;
        cn.vel.set(dx, 1.5, dz).normalize().multiplyScalar(kickSpeed*0.8);
        cn.vel.y = 2.5 + kickSpeed*0.2;
        cn.spin = (Math.random()-0.5)*10;
      }
    } else if (cn.mesh.position.y > -1) {
      cn.vel.y -= 18*dt;
      cn.mesh.position.addScaledVector(cn.vel, dt);
      cn.mesh.rotation.x += cn.spin*dt;
      cn.mesh.rotation.z += cn.spin*dt*0.7;
      if (cn.mesh.position.y < 0 && cn.vel.y < 0) {
        cn.mesh.position.y = 0; cn.vel.y *= -0.35;
        cn.vel.x *= 0.7; cn.vel.z *= 0.7;
        if (Math.abs(cn.vel.y) < 0.5) cn.vel.set(0,0,0);
      }
    }
  }

  // ---- kontrol noktaları ----
  const activePos = state.pos;
  if (active) {
    for (const cp of checkpoints) {
      if (!cp.reached) {
        const dx = cp.x - activePos.x, dz = cp.z - activePos.z;
        if (dx*dx + dz*dz < cp.r*cp.r && Math.abs(activePos.y - cp.y) < 4) {
          cp.reached = true;
          if (cp.flag) cp.flag.material.color.set(0xffd166);
          if (cp.idx > prog.activeCP) prog.activeCP = cp.idx;
          if (!prog.started) { prog.started = true; prog.startTime = elapsed; }
          document.getElementById('jumps').textContent = (prog.activeCP+1) + ' / ' + checkpoints.length;
          if (cp.idx > 0) showMsg('✅ Kontrol noktası ' + (cp.idx+1));
        }
      }
    }
    // süre
    if (prog.started && !prog.finished) {
      document.getElementById('air').textContent = (elapsed - prog.startTime).toFixed(1) + ' sn';
    }
    // kupa / bitiş
    if (window._cup && !prog.finished) {
      const dx = window._cup.x - activePos.x, dz = window._cup.z - activePos.z;
      if (dx*dx + dz*dz < 9 && Math.abs(activePos.y - window._cup.y) < 4) {
        prog.finished = true;
        const t = (elapsed - prog.startTime).toFixed(1);
        showMsg('🏆 Parkuru bitirdin! Süre: ' + t + ' sn');
      }
    }
  }
  // kupa döner ve hafif süzülür
  cup.rotation.y += dt * 1.2;
  cup.position.y = Math.sin(elapsed*1.5)*0.25;

  // deniz hafif dalgalanma
  sea.material.opacity = 0.85 + Math.sin(elapsed*0.8)*0.05;

  // kamera (insan ölçeği: daha yakın)
  let targetCam;
  if (!active) {
    // seçim ekranı: karakterin önünden hafif dönen vitrin açısı
    player.rotation.y = Math.sin(elapsed*0.6)*0.5;
    const a = elapsed*0.25;
    targetCam = new THREE.Vector3(Math.sin(a)*4.5, 2.6, Math.cos(a)*4.5 + 1);
    camPos.lerp(targetCam, Math.min(1, dt*3));
    camera.position.copy(camPos);
    camera.lookAt(0, 1.4, 0);
  } else {
    const cf = fwd;
    const dist = 6;
    const high = 3.2;
    if (camMode === 0) {
      targetCam = new THREE.Vector3(state.pos.x - cf.x*dist, state.pos.y + high, state.pos.z - cf.z*dist);
    } else if (camMode === 1) {
      targetCam = new THREE.Vector3(state.pos.x - cf.x*(dist*0.55), state.pos.y + high*0.7, state.pos.z - cf.z*(dist*0.55));
    } else {
      targetCam = new THREE.Vector3(state.pos.x, state.pos.y + 42, state.pos.z + 0.1);
    }
    camPos.lerp(targetCam, Math.min(1, dt * 4));
    camera.position.copy(camPos);
    camera.lookAt(state.pos.x, state.pos.y + 1.5, state.pos.z);
  }

  const targetFov = sprinting ? 78 : 70;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt*5);
  camera.updateProjectionMatrix();

  moonLight.position.set(state.pos.x - 120, 190, state.pos.z - 60);
  moonLight.target.position.copy(state.pos);
  moonLight.target.updateMatrixWorld();

  document.getElementById('spd').textContent = Math.round(Math.abs(state.speed) * 3.6);

  renderer.render(scene, camera);
}
// ---------- Karakter seçimi ----------
window._started = false;
document.querySelectorAll('#charSelect .card').forEach(btn => {
  // fare ile üzerine gelince vitrindeki figür değişsin
  btn.addEventListener('mouseenter', () => {
    if (!window._started) buildCharacter(btn.dataset.char);
  });
  btn.addEventListener('click', () => {
    buildCharacter(btn.dataset.char);
    player.rotation.y = 0;
    const overlay = document.getElementById('charSelect');
    overlay.style.transition = 'opacity .4s';
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.display = 'none'; }, 400);
    window._started = true;
  });
});

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
